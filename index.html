<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Revelación de Género</title>

<!-- Portada al compartir (WhatsApp, Facebook, etc.) -->
<meta property="og:title" content="¿Niño o Niña? 👶💙💗🎀🍼">
<meta property="og:description" content="Estamos muy emocionados por descubrirlo contigo">
<meta property="og:image" content="https://raw.githubusercontent.com/regina1503/REVELACION-DE-GENERO/main/portada.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    width:100%;
    overflow:hidden;
    background:#000;
    font-family: 'Segoe UI', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .video-container {
    position:relative;
    height:100vh;
    width:100vw;
    max-width:calc(100vh * 9 / 16);
    overflow:hidden;
    background:#000;
  }
  #bgVideo {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .progress-container {
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    width:80%;
    z-index:10;
  }
  .progress-bar {
    width:100%;
    height:6px;
    background:rgba(255,255,255,0.3);
    border-radius:10px;
    cursor:pointer;
    position:relative;
  }
  .progress-fill {
    height:100%;
    width:0%;
    background:linear-gradient(135deg, #ff6fa5, #6fc7ff);
    border-radius:10px;
    pointer-events:none;
  }
  .location-btn {
    position:absolute;
    left:50%;
    bottom:60px;
    transform:translateX(-50%) translateY(20px);
    background:linear-gradient(135deg, #ff6fa5, #6fc7ff);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:16px;
    padding:14px 36px;
    border-radius:50px;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease, transform 0.5s ease;
    z-index:10;
  }
  .location-btn.show {
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  .location-btn svg {
    width:18px;
    height:18px;
    fill:#fff;
  }
  .center-btn {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:80px;
    height:80px;
    border-radius:50%;
    background:rgba(0,0,0,0.5);
    color:#fff;
    border:none;
    font-size:32px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:15;
    opacity:1;
    transition:opacity 0.3s ease;
  }
  .center-btn.hidden {
    opacity:0;
    pointer-events:none;
  }
  .play-overlay {
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
    cursor:pointer;
  }
  .play-overlay.hidden { display:none; }
  .play-btn {
    width:80px;
    height:80px;
    border-radius:50%;
    background:rgba(255,255,255,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    color:#333;
  }
</style>
</head>
<body>

<div class="video-container">
  <video id="bgVideo" playsinline loop preload="auto">
    <source src="https://raw.githubusercontent.com/regina1503/REVELACION-DE-GENERO/main/REVELACION%20DE%20GENERO.mp4" type="video/mp4">
    Tu navegador no soporta video HTML5.
  </video>

  <button class="center-btn hidden" id="playPauseBtn" title="Pausar/Reproducir">⏸</button>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <a href="https://www.google.com/maps?q=20.6134878,-100.3249092&z=17&hl=es"
     target="_blank"
     rel="noopener"
     class="location-btn"
     id="locationBtn">
    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
    Ver ubicación
  </a>

  <div class="play-overlay" id="playOverlay">
    <div class="play-btn">▶</div>
  </div>
</div>

<script>
  const video = document.getElementById('bgVideo');
  const locationBtn = document.getElementById('locationBtn');
  const playOverlay = document.getElementById('playOverlay');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const playPauseBtn = document.getElementById('playPauseBtn');

  // Rango en el que se muestra el botón de ubicación
  const SHOW_START = 19;
  const SHOW_END = 25;

  video.addEventListener('timeupdate', () => {
    if (video.currentTime >= SHOW_START && video.currentTime <= SHOW_END) {
      locationBtn.classList.add('show');
    } else {
      locationBtn.classList.remove('show');
    }

    if (video.duration) {
      const pct = (video.currentTime / video.duration) * 100;
      progressFill.style.width = pct + '%';
    }
  });

  // El overlay siempre pide un tap: así el video arranca con audio directo
  // (los navegadores solo permiten audio si el usuario interactuó primero)
  playOverlay.addEventListener('click', () => {
    video.muted = false;
    video.play();
    playOverlay.classList.add('hidden');
    hideCenterBtnIfPlaying();
  });

  function seekFromEvent(e) {
    const rect = progressBar.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const ratio = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
    if (video.duration) {
      video.currentTime = ratio * video.duration;
    }
  }

  progressBar.addEventListener('click', seekFromEvent);
  progressBar.addEventListener('touchstart', seekFromEvent);

  // Botón central de pausa/reproducción
  let userPaused = false;
  let hideTimeout = null;

  function showCenterBtn() {
    playPauseBtn.classList.remove('hidden');
    playPauseBtn.textContent = video.paused ? '▶' : '⏸';
  }

  function hideCenterBtnIfPlaying() {
    clearTimeout(hideTimeout);
    if (!video.paused) {
      hideTimeout = setTimeout(() => {
        playPauseBtn.classList.add('hidden');
      }, 800);
    }
  }

  playPauseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (video.paused) {
      video.play();
      userPaused = false;
      showCenterBtn();
      hideCenterBtnIfPlaying();
    } else {
      video.pause();
      userPaused = true;
      showCenterBtn();
    }
  });

  // Tocar la pantalla (fuera de los controles) muestra el botón de nuevo
  document.querySelector('.video-container').addEventListener('click', (e) => {
    if (e.target === playPauseBtn || e.target.closest('#progressBar') || e.target.closest('.location-btn') || e.target.closest('.play-overlay')) {
      return;
    }
    showCenterBtn();
    hideCenterBtnIfPlaying();
  });

  // Evitar que el video se pause al abrir el link de ubicación:
  // si el navegador lo pausa por perder el foco (al abrir Maps en otra
  // pestaña/app), lo reanudamos automáticamente al volver, a menos que
  // el usuario lo haya pausado manualmente.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && video.paused && !userPaused) {
      video.play();
      hideCenterBtnIfPlaying();
    }
  });

  locationBtn.addEventListener('click', () => {
    // No pausar el video al abrir el mapa
    setTimeout(() => {
      if (video.paused && !userPaused) {
        video.play();
      }
    }, 300);
  });
</script>

</body>
</html>
